<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Form System — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<!-- Top Bar -->
<header class="topbar">
    <div class="topbar-brand">
        <span class="brand-mark">SFS</span>
        <span class="brand-name">Admin Panel</span>
    </div>

    <div class="account-menu-wrap">
        <a href="dashboard.html" class="admin-back-link">← My Dashboard</a>
    </div>
</header>

<main class="dashboard">

    <section class="welcome-row">
        <div>
            <span class="welcome-eyebrow">Admin</span>
            <h1 class="welcome-heading">All Students</h1>
        </div>
    </section>

    <div class="card">
        <table class="admin-table" id="usersTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Joined</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <tr><td colspan="5" class="admin-loading">Loading...</td></tr>
            </tbody>
        </table>
    </div>

</main>

<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin-users.js"></script>
</body>
</html>
